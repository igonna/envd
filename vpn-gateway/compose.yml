services:
  render:
    build:
      context: .
      dockerfile: Dockerfile.render
    restart: "no"
    env_file: [.env]
    volumes:
      - ./config.template.json:/in/config.template.json:ro
      - xray_config:/out
    command: >
      sh -lc "
        export XRAY_HTTP_PROXY_PORT=\${XRAY_HTTP_PROXY_PORT:-\${XRAY_HTTP_RPOXY_PORT:-1081}} &&
        envsubst < /in/config.template.json > /out/config.json &&
        test -s /out/config.json
      "
    networks: [inside]

  xray:
    image: teddysun/xray:latest
    restart: unless-stopped
    depends_on:
      render:
        condition: service_completed_successfully
    ports:
      - "${XRAY_BIND_IP:-127.0.0.1}:${XRAY_SOCKS_PORT:-1080}:${XRAY_INBOUND_PORT:-1080}"
      - "${XRAY_BIND_IP:-127.0.0.1}:${XRAY_HTTP_PROXY_PORT:-${XRAY_HTTP_RPOXY_PORT:-1081}}:${XRAY_HTTP_PROXY_PORT:-${XRAY_HTTP_RPOXY_PORT:-1081}}"
    volumes:
      - xray_config:/etc/xray:ro
    command: >
      sh -lc "
        for i in \$(seq 1 60); do
          [ -s /etc/xray/config.json ] && break;
          sleep 1;
        done;
        test -s /etc/xray/config.json &&
        exec xray -config /etc/xray/config.json
      "
    networks:
      outside:
        priority: 1000
        gw_priority: 1
      inside:
        priority: 100
        gw_priority: 0

networks:
  inside:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  outside: {}


volumes:
  xray_config:
