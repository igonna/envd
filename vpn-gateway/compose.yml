services:
  render:
    build:
      context: .
      dockerfile: Dockerfile.render
    restart: "no"
    env_file: [.env]
    volumes:
      - ./config.template.json:/in/config.template.json:ro
      - xray_config:/out
    command: >
      sh -lc "
        export XRAY_HTTP_PROXY_PORT=\${XRAY_HTTP_PROXY_PORT:-\${XRAY_HTTP_RPOXY_PORT:-1081}} &&
        export XRAY_FINGERPRINT=\${XRAY_FINGERPRINT:-firefox} &&
        envsubst < /in/config.template.json > /out/config.json &&
        test -s /out/config.json
      "
    networks: [inside]

  xray:
    # Xray 26.2.6 multi-arch OCI index. Do not use mutable latest here.
    image: teddysun/xray@sha256:5ced88b51b157890fbadeb5dc6d70f157f5d577cd5d93ec09b30d14b86b07fde
    restart: unless-stopped
    depends_on:
      render:
        condition: service_completed_successfully
    ports:
      - "${XRAY_BIND_IP:-127.0.0.1}:${XRAY_SOCKS_PORT:-1080}:${XRAY_INBOUND_PORT:-1080}"
      - "${XRAY_BIND_IP:-127.0.0.1}:${XRAY_HTTP_PROXY_HOST_PORT:-${XRAY_HTTP_PROXY_PORT:-${XRAY_HTTP_RPOXY_PORT:-1081}}}:${XRAY_HTTP_PROXY_PORT:-${XRAY_HTTP_RPOXY_PORT:-1081}}"
    volumes:
      - xray_config:/etc/xray:ro
    command: >
      sh -lc "
        for i in \$(seq 1 60); do
          [ -s /etc/xray/config.json ] && break;
          sleep 1;
        done;
        test -s /etc/xray/config.json &&
        exec xray -config /etc/xray/config.json
      "
    networks:
      outside:
        priority: 1000
        gw_priority: 1
      inside:
        priority: 100
        gw_priority: 0

networks:
  inside:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  outside: {}


volumes:
  xray_config:
